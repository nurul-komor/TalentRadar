name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Install Playwright's Chromium binary
        run: npx playwright install --with-deps chromium
        working-directory: api

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
